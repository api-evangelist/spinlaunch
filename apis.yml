name: SpinLaunch
description: 'SpinLaunch is a space technology company developing a kinetic launch
  system that uses a rotating carbon-fiber arm inside a large vacuum chamber to accelerate
  launch vehicles to thousands of kilometers per hour before ignition, aiming to eliminate
  up to 70 percent of the fuel and structure of a conventional rocket. It operates
  a Suborbital Accelerator test facility at Spaceport America in New Mexico that doubles
  as a customer payload-testing platform, and is developing an Orbital Launch System
  alongside its Meridian satellite broadband constellation for enterprise connectivity.
  Backed by GV, the company currently publishes no public developer API, documentation,
  or SDK surface; this profile captures its identity and domain-security posture.'
